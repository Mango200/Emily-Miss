<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Does Adam miss Emily?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miss Emily">
<meta name="theme-color" content="#ffd9e0">
<style>
:root{--bg:#ffe3e8;--ink:#5a1a2e;--btn:#e8365d;--btn2:#b81e43;--duck:#ffd23f;--crab:#e8452c}
@media (prefers-color-scheme:dark){:root{--bg:#2a0f1a;--ink:#ffd9e0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
 padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);overflow-x:hidden;
 display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.heart{position:absolute;bottom:-40px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:420px;text-align:center;padding:28px 0 30px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px}
.sub{margin:0 0 22px;opacity:.75}
#big{width:min(72vw,280px);aspect-ratio:1;border:0;border-radius:50%;color:#fff;font:700 1.35rem/1.2 inherit;
 background:radial-gradient(circle at 35% 30%,#ff7a96,var(--btn) 55%,var(--btn2));
 box-shadow:0 10px 0 var(--btn2),0 18px 30px rgba(184,30,67,.4);transition:transform .08s,box-shadow .08s;
 touch-action:manipulation;cursor:pointer;padding:20px}
#big:active{transform:translateY(8px);box-shadow:0 2px 0 var(--btn2),0 6px 14px rgba(184,30,67,.4)}
#msg{min-height:4.6em;margin:24px 0 4px;font-size:1.3rem;font-weight:700;white-space:pre-line;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;line-height:1.35}
#msg.typing::after{content:"|";margin-left:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#count{font-size:1.4rem;font-weight:800;margin-bottom:10px;font-variant-numeric:tabular-nums}
#count small{display:block;font-size:.85rem;font-weight:500;opacity:.75}
#meter{height:14px;border-radius:7px;background:rgba(0,0,0,.12);overflow:hidden;margin:0 auto;max-width:300px}
#fill{height:100%;width:99.9%;background:var(--btn);transition:width .3s}
#meter.over #fill{background:linear-gradient(90deg,var(--btn),#ff9ab0,var(--btn));background-size:200% 100%;animation:shine 1.5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
#pair{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:22px}
#pair svg{width:130px;height:auto}
#duck{animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
#crab{animation:scuttle 1.4s ease-in-out infinite}
#mid{font-size:1.6rem;padding-bottom:36px;animation:beat 1.2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-5deg)}}
@keyframes scuttle{50%{transform:translateX(5px)}}
@keyframes beat{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){#duck,#crab,#mid,#meter.over #fill{animation:none}.heart{display:none}}
</style>
</head>
<body>
<div id="sky"></div>
<main>
  <h1>Does Adam miss Emily?</h1>
  <p class="sub">Press the button to find out</p>
  <button id="big" aria-label="Does Adam miss Emily?">Does Adam miss Emily?</button>
  <div id="msg" aria-live="polite"></div>
  <div id="count"></div>
  <div id="meter"><div id="fill"></div></div>

  <div id="pair">
    <svg id="crab" viewBox="0 0 120 100" aria-label="Adam the crab">
      <g stroke="#b32a15" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M30 70 L14 82 M36 76 L24 92 M90 70 L106 82 M84 76 L96 92"/>
        <path d="M34 52 L18 34 M86 52 L102 34"/>
      </g>
      <circle cx="14" cy="28" r="13" fill="var(--crab)"/><path d="M14 28 L8 16 L20 18z" fill="var(--bg)"/>
      <circle cx="106" cy="28" r="13" fill="var(--crab)"/><path d="M106 28 L112 16 L100 18z" fill="var(--bg)"/>
      <ellipse cx="60" cy="64" rx="34" ry="24" fill="var(--crab)"/>
      <path d="M48 42 L48 34 M72 42 L72 34" stroke="#b32a15" stroke-width="4" stroke-linecap="round"/>
      <circle cx="48" cy="31" r="7" fill="#fff"/><circle cx="72" cy="31" r="7" fill="#fff"/>
      <circle cx="49" cy="32" r="3.2" fill="#222"/><circle cx="73" cy="32" r="3.2" fill="#222"/>
      <path d="M50 70 q10 -8 20 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M32 58 q-8 -2 -10 6 M88 58 q8 -2 10 6" stroke="#ff9a8a" stroke-width="0" fill="none"/>
    </svg>
    <div id="mid">💗</div>
    <svg id="duck" viewBox="0 0 100 100" aria-label="Emily the happy duck">
      <ellipse cx="50" cy="70" rx="30" ry="22" fill="var(--duck)"/>
      <path d="M22 66 q-10 -4 -12 -14 q10 2 16 8z" fill="var(--duck)"/>
      <path d="M32 72 q16 10 34 0" stroke="#e9b21c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="38" r="26" fill="var(--duck)"/>
      <path d="M46 14 q-2 -8 4 -10 M52 14 q2 -8 8 -6" stroke="#e9b21c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="48" rx="15" ry="8" fill="#f4a63a"/>
      <path d="M35 36 q5 -7 10 0 M55 36 q5 -7 10 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="33" cy="46" r="5" fill="#ff9ab0" opacity=".75"/><circle cx="67" cy="46" r="5" fill="#ff9ab0" opacity=".75"/>
      <path d="M43 52 q7 6 14 0" stroke="#b36b00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</main>
<script>
// ---- Edit these! ----
const BASE = ["Hi Emily, yes I miss you", "Hi Emily, yes I still miss you"];
const MORE = [
  "I miss you more",
  "I miss you even more now",
  "I miss you more than before",
  "I miss you a bit more each time",
  "I still miss you, more"
];
const HEARTS = ["💗","💖","💕","🌸","💛"];
// ---------------------
const $ = id => document.getElementById(id);
let n = 0;
try { n = parseInt(localStorage.getItem("missCount")) || 0; } catch(e){}

function render(){
  const pct = 99.9 + n * 0.7;
  const over = pct > 100;
  $("count").innerHTML = `Adam misses Emily: ${pct.toFixed(1)}%` +
    `<small>${over ? "Over 100%, and it keeps growing" : "Almost full, but there is always room for more"}</small>`;
  $("fill").style.width = Math.min(100, pct) + "%";
  $("meter").classList.toggle("over", over);
}
function heart(){
  const h = document.createElement("span");
  h.className = "heart"; h.textContent = HEARTS[Math.random()*HEARTS.length|0];
  h.style.left = Math.random()*100 + "%";
  h.style.fontSize = 18 + Math.random()*28 + "px";
  h.style.animationDuration = 3 + Math.random()*3 + "s";
  $("sky").appendChild(h); setTimeout(()=>h.remove(), 6500);
}
function hearts(k){ for(let i=0;i<k;i++) setTimeout(heart, i*70); }

let typer;
function typeOut(text){
  clearInterval(typer);
  let i = 0; const el = $("msg");
  el.textContent = ""; el.classList.add("typing");
  typer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length){ clearInterval(typer); el.classList.remove("typing"); }
  }, 45);
}
$("big").addEventListener("click", () => {
  n++;
  try { localStorage.setItem("missCount", n); } catch(e){}
  const base = n === 1 ? BASE[0] : BASE[1];
  const more = n === 1 ? "" : "\n" + MORE[Math.random()*MORE.length|0] + " 💗";
  typeOut(base + more);
  if (navigator.vibrate) navigator.vibrate(30);
  hearts(14);
  render();
});
render(); hearts(6);
setInterval(heart, 1800);
</script>
</body>
</html>
